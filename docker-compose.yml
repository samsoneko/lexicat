version: '3.8'

services:
  backend:
    image: ghcr.io/pocketbase/pocketbase:latest
    container_name: lexica-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Persists user progress locally
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    command: serve --http=0.0.0.0:8090

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lexica-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - POCKETBASE_URL=http://backend:8090
    depends_on:
      - backend
